<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a1218" />
  <meta name="description" content="Ombre du Dojo — shinobi vue de côté, plateformes, katana et coups de pied." />
  <title>Ombre du Dojo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="900" height="520" aria-label="Zone de jeu"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="bar-wrap"><div id="hp-bar" class="bar-fill"></div></div>
        <div id="hp-text" class="hud-meta">120</div>
      </div>
      <div class="hud-center">
        <div id="level-label">Niv. 1</div>
        <div class="hud-wave">⚔ <span id="wave-label">0</span></div>
      </div>
      <div class="hud-right">
        <div class="gold-row">◆ <span id="gold-hud">0</span></div>
        <div id="weapon-chip" class="weapon-chip">Katana</div>
        <button type="button" id="btn-skip-level" class="hud-next" aria-label="Niveau suivant">Niveau suivant ▶</button>
      </div>
    </div>

    <div id="controls" class="hidden">
      <!-- Croix directionnelle style PlayStation -->
      <div class="ctrl-cluster left">
        <div class="dpad" aria-label="Croix directionnelle">
          <button type="button" class="ctrl dpad-btn up" data-act="jump" aria-label="Haut / Saut">▲</button>
          <button type="button" class="ctrl dpad-btn left" data-act="left" aria-label="Gauche">◀</button>
          <button type="button" class="ctrl dpad-btn right" data-act="right" aria-label="Droite">▶</button>
          <button type="button" class="ctrl dpad-btn down" data-act="down" aria-label="Bas / Accroupir">▼</button>
        </div>
      </div>
      <!-- Boutons action style PlayStation (losange) -->
      <div class="ctrl-cluster right">
        <div class="face-pad" aria-label="Boutons action">
          <button type="button" class="ctrl face jump" data-act="jump" aria-label="Saut / Flip">△</button>
          <button type="button" class="ctrl face kick" data-act="kick" aria-label="Coup de pied">○</button>
          <button type="button" class="ctrl face attack" data-act="attack" aria-label="Katana">□</button>
          <button type="button" class="ctrl face defend" data-act="defend" aria-label="Défense">✕</button>
        </div>
      </div>
    </div>

    <section id="screen-menu" class="screen">
      <div class="menu-glow"></div>
      <p class="eyebrow">JEUX ÉMILE</p>
      <h1>Ombre du Dojo</h1>
      <p class="tagline">Shinobi vue de côté — flip, katana, coups de pied, défense et ennemis réactifs.</p>
      <div class="menu-actions">
        <button type="button" id="btn-play" class="btn primary">Jouer</button>
        <button type="button" id="btn-continue" class="btn ghost hidden">Continuer</button>
      </div>
      <p class="hint">Croix ▲▼◀▶ · △ saut · □ katana · ○ pied · ✕ défense · Clavier : flèches · J · K · L · Espace</p>
    </section>

    <section id="screen-shop" class="screen hidden">
      <h2>Boutique du Dojo</h2>
      <p class="shop-gold">Or: <span id="shop-gold">0</span> ◆</p>
      <p class="shop-level">Prochain niveau: <span id="shop-next">2</span></p>
      <div class="shop-tabs">
        <button type="button" class="tab active" data-tab="upgrades">Améliorations</button>
        <button type="button" class="tab" data-tab="outfits">Tenues</button>
        <button type="button" class="tab" data-tab="weapons">Armes</button>
      </div>
      <div id="shop-list" class="shop-list"></div>
      <div class="menu-actions">
        <button type="button" id="btn-next-level" class="btn primary">Niveau suivant</button>
        <button type="button" id="btn-menu-from-shop" class="btn ghost">Menu</button>
      </div>
    </section>

    <section id="screen-pause" class="screen hidden">
      <h2>Pause</h2>
      <div class="menu-actions">
        <button type="button" id="btn-resume" class="btn primary">Reprendre</button>
        <button type="button" id="btn-pause-next" class="btn primary">Niveau suivant</button>
        <button type="button" id="btn-quit" class="btn ghost">Abandonner</button>
      </div>
    </section>

    <section id="screen-over" class="screen hidden">
      <h2 id="over-title">Défaite</h2>
      <p id="over-msg" class="tagline"></p>
      <div class="menu-actions">
        <button type="button" id="btn-next-after" class="btn primary">Niveau suivant</button>
        <button type="button" id="btn-retry" class="btn ghost">Réessayer</button>
        <button type="button" id="btn-shop-after" class="btn ghost">Boutique</button>
        <button type="button" id="btn-menu-over" class="btn ghost">Menu</button>
      </div>
    </section>

    <button type="button" id="btn-pause" class="pause-btn hidden" aria-label="Pause">❚❚</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
